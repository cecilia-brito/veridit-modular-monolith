version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: veridit_postgres
    environment:
      POSTGRES_USER: veridit_user
      POSTGRES_PASSWORD: veridit_password
      POSTGRES_DB: veridit_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  object_storage:
    image: minio/minio:latest
    container_name: veridit_minio
    environment:
      MINIO_ROOT_USER: veridit_storage_user
      MINIO_ROOT_PASSWORD: veridit_storage_password
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
